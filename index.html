<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <!-- Main Wrapper -->
    <div class="flex bg-[#F5F5F6]">
        <!-- Sidebar -->
        <aside class="w-3xs">
            <!-- Logo -->
            <div class="flex items-center gap-2 p-6">
                <img src="./assets/logo.png" alt="SnowUI Logo">
                <img src="./assets/snowui-text.png" alt="SnowUI Text">
            </div>
            <!-- Navigation Links -->
            <nav class="ml-4">
                <ul class="flex flex-col gap-1 [&>li>a]:flex [&>li>a]:items-center [&>li>a]:gap-3 [&>li>a]:px-3 [&>li>a]:py-4">
                    <li class="bg-[#0000000A] rounded-2xl"><a href="#"><img src="./assets/icons/overview.svg" alt="Overview">Overview</a></li>
                    <li><a href="#"><img src="./assets/icons/ecommerce.svg" alt="eCommerce">eCommerce</a></li>
                    <li><a href="#"><img src="./assets/icons/projects.svg" alt="Projects">Projects</a></li>
                    <li><a href="#"><img src="./assets/icons/user-profile.svg" alt="User Profile">User Profile</a></li>
                    <li><a href="#"><img src="./assets/icons/account.svg" alt="Account">Account</a></li>
                    <li><a href="#"><img src="./assets/icons/corporate.svg" alt="Corporate">Corporate</a></li>
                    <li><a href="#"><img src="./assets/icons/blog.svg" alt="Blog">Blog</a></li>
                    <li><a href="#"><img src="./assets/icons/social.svg" alt="Social">Social</a></li>
                </ul>
            </nav>
        </aside>
        <!-- Main Content -->
        <main class="flex-1">
            <!-- Header -->
            <header class="flex items-center justify-between p-5">
                <!-- left side -->
                <div class="flex items-center gap-3">
                    <button><img src="./assets/icons/sidebar-toggle.svg" alt="Sidebar Toggle"></button>
                    <button><img src="./assets/icons/star.svg" alt="Star"></button>
                    <span class="text-[#00000066] text-base">Dashboards</span>
                    <span class="text-[#0000001A]">/</span>
                    <span class="text-[#000000] text-base">Overview</span>
                </div>
                <!-- Right Side -->
                <div class="flex items-center gap-2">
                    <div class="flex items-center gap-2 bg-[#0000000A] rounded-lg px-3 py-2">
                        <i class="fa-solid fa-magnifying-glass text-[#00000033]"></i>
                        <input type="text" placeholder="Search" class="outline-none w-[160px]">
                        <span class="text-[#00000033] bg-[#eeeeee] border border-[#0000001A] p-3 rounded w-[20px] h-[16px] inline-flex items-center justify-center">/</span>
                    </div>
                    <button><img src="./assets/icons/night-mode.svg" alt="Night Mode"></button>
                    <button><img src="./assets/icons/clock-counter-clockwise.svg" alt="Clock Counter Clockwise"></button>
                    <button><img src="./assets/icons/notification.svg" alt="Notification"></button>
                </div>
            </header>
            <!-- Stats Cards -->
            <section class="p-5">
                <div class="grid grid-cols-4 gap-4">
                    <div class="rounded-3xl px-5 py-4 bg-gradient-to-br from-[#007AFF]  to-[#8CC8FF]  shadow-[0_8px_32px_rgba(74,158,255,0.3)]">
                        <!-- Card 1 - Views -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-white text-base">Views</span>
                            <button><img src="./assets/icons/arrow-up-right.svg" alt="Arrow Up Right"></button>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-2xl text-white font-semibold">7,265</span>
                            <span class="text-white/90 text-base font-normal">+11.01%</span>
                        </div>
                    </div>
                    <div class="rounded-3xl px-5 py-4 bg-gradient-to-br from-[#2D2D2D] to-[#5A5A5A]   shadow-[0_8px_32px_rgba(45,45,45,0.3)]">
                        <!-- Card 2 - Visits  -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-white text-base">Visits</span>
                            <button><img src="./assets/icons/arrow-down-left.svg" alt="Arrow Down Left"></button>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-2xl text-white font-semibold">3,671</span>
                            <span class="text-white/90 text-base font-normal">-0.03%</span>
                        </div>
                    </div>
                    <div class="rounded-3xl px-5 py-4 bg-gradient-to-br from-[#007AFF]  to-[#8CC8FF]  shadow-[0_8px_32px_rgba(74,158,255,0.3)">
                        <!-- Card 3 - New Users -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-white text-base">New Users</span>
                            <button><img src="./assets/icons/arrow-up-right.svg" alt="Arrow Up Right"></button>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-2xl text-white font-semibold">256</span>
                            <span class="text-white/90 text-base font-normal">+15.03%</span>
                        </div>
                    </div>
                    <div class="rounded-3xl px-5 py-4 bg-gradient-to-br from-[#2D2D2D] to-[#5A5A5A]   shadow-[0_8px_32px_rgba(45,45,45,0.3)">
                        <!-- Card 4 - Active Users -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-white text-base">Active Users</span>
                            <button><img src="./assets/icons/arrow-down-left.svg" alt="Arrow Down Left"></button>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-2xl text-white font-semibold">2,318</span>
                            <span class="text-white/90 text-base font-normal">+6.08%</span>
                        </div>
                    </div>
                </div>
            </section>
            <!-- Chart Section -->
            <section>
                <div>
                    <!-- Tabs -->
                    <div>
                        <button>Users</button>
                        <button>Projects</button>
                        <button>Operating Status</button>
                    </div>
                    <!-- Right Side -->
                    <div>
                        <button>Week <img src="./assets/icons/arrow-line-down.svg" alt="Arrow Line Down"></button>
                        <button>
                            <img src="./assets/icons/chart-line.svg" alt="Chart Line">
                            <img src="./assets/icons/arrow-line-down.svg" alt="Arrow Line Down">
                        </button>
                        <button><img src="./assets/icons/three-dots.svg" alt="Three Dots"></button>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
